<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#070a16" />
    <meta name="description" content="One shot. Hit every target. A trick-shot puzzle game." />
    <title>One Shot</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23070a16'/%3E%3Ccircle cx='32' cy='32' r='18' fill='none' stroke='%23ff9f1c' stroke-width='6'/%3E%3Ccircle cx='32' cy='32' r='6' fill='%23fff'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="stage"></div>

    <header id="hud">
      <button id="btn-menu" class="icon" aria-label="Menu">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16" /></svg>
      </button>
      <div class="hud-center">
        <div id="hud-level">LEVEL 1</div>
        <div id="hud-try">TRY 1</div>
      </div>
      <button id="btn-sound" class="icon" aria-label="Sound">
        <svg viewBox="0 0 24 24" class="on">
          <path d="M4 9v6h4l5 4V5L8 9H4z" />
          <path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" />
        </svg>
        <svg viewBox="0 0 24 24" class="off">
          <path d="M4 9v6h4l5 4V5L8 9H4z" />
          <path d="M17 9l5 6M22 9l-5 6" />
        </svg>
      </button>
      <button id="btn-retry" class="icon" aria-label="Retry">
        <svg viewBox="0 0 24 24">
          <path d="M4 12a8 8 0 1 0 2.5-5.8" />
          <path d="M4 4v5h5" />
        </svg>
      </button>
    </header>

    <div id="hint">Drag anywhere to aim &middot; release to shoot</div>
    <div id="toast"></div>

    <section id="panel-win" class="panel hidden">
      <h2 id="win-title">SOLVED!</h2>
      <p id="win-sub"></p>
      <div class="row">
        <button id="btn-again" class="btn ghost">Replay</button>
        <button id="btn-next" class="btn">Next level</button>
      </div>
    </section>

    <section id="menu" class="screen">
      <div class="logo">
        <div class="logo-ring"></div>
        <h1>ONE<br />SHOT</h1>
      </div>
      <p class="tagline">One shot. Every target. Make it bounce.</p>
      <button id="btn-play" class="btn big">Play</button>
      <div id="level-grid"></div>
    </section>

    <script type="module" src="/src/game/main.ts"></script>
  </body>
</html>
